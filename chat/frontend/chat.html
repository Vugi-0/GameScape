<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gamescape Chat</title>
  <link rel="stylesheet" href="/static/chat.css" />
</head>
<body>

<div id="wrapper">

  <div id="header">
    <h1>GameScape <span>Chat</span></h1>
    <div id="connect-row">
      <input id="username" placeholder="Username" autocomplete="off" />
      <button onclick="connectChat()">Connect</button>
    </div>
    <div id="status">not connected</div>
  </div>

  <div id="body">

    <div id="sidebar">
      <div id="online-count">online — 0</div>
      <div id="user-list"></div>
    </div>

    <div id="main">
      <div id="tabs"></div>
      <div id="chat"></div>
      <div id="compose">
        <input id="input" placeholder="Message..." autocomplete="off" />
        <button onclick="sendChatMessage()">Send</button>
      </div>
    </div>

  </div>

</div>

<script src="/static/chat.js"></script>

</body>
</html>
